version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "cplex" },
    { name = "gurobipy" },
    { name = "numpy" },
    { name = "polars" },
    { name = "pyomo" },
    { name = "scipy" },
]

[package.metadata]
requires-dist = [
    { name = "cplex", specifier = ">=22.2.0.1" },
    { name = "gurobipy", specifier = ">=13.0.3" },
    { name = "numpy", specifier = ">=2.5.4" },
    { name = "polars", specifier = ">=2.0.0" },
    { name = "pyomo", specifier = ">=6.10.1" },
    { name = "scipy", specifier = ">=1.18.1" },
]
